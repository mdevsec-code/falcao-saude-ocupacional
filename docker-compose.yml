version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: falcao-saude-ocupacional:latest
    container_name: falcao-web
    ports:
      - '8080:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
